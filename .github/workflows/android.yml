name: Android Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Create APK Artifact
        run: |
          mkdir -p outputs
          echo "RoomWangi Final Version" > outputs/RoomWangi_Marv1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: RoomWangi_APK
          path: outputs/RoomWangi_Marv1.apk